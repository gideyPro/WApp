name: Build Local APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL for this local build (e.g. http://192.168.1.42:8000)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Inject LAN host into network security config
        run: |
          HOST=$(echo "${{ inputs.api_base_url }}" | sed -E 's#^https?://([^/:]+).*#\1#')
          echo "Allowing cleartext to host: $HOST"
          sed -i "s|>localhost<|>${HOST}<|" android/app/src/main/res/xml/network_security_config.xml
          cat android/app/src/main/res/xml/network_security_config.xml

      - name: Build Local Release APK
        run: flutter build apk --release --target-platform android-arm64,android-arm --dart-define=GOOGLE_WEB_CLIENT_ID=573697335656-4rmtd6brd3t6jqkhphqbqmp1bs6ij5hg.apps.googleusercontent.com --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-local.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
